[project]
name = "jobscratch"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "websocket-client>=1.6.0,<2.0.0",
    "requests>=2.28.0,<3.0.0",
    "langgraph>=1.2.11",
]

[project.scripts]
jobscratch = "jobscratch.jobscratch:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jobscratch"]
